services:
  minio:
    image: minio/minio:latest
    container_name: flight-delays-minio
    ports:
      - "9000:9000"
      - "9001:9001"    
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: very-intensive-data
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
    driver: local